{% extends "base.html" %}

{% block title %}{{ title }} | Face Recognition Attendance{% endblock %}

{% block content %}
<section class="glass-card error-card">
    <p class="eyebrow">System Message</p>
    <h2>{{ title }}</h2>
    <p class="muted-text">{{ message }}</p>
    <a href="{{ url_for('dashboard.index') if session.get('admin_id') else url_for('auth.login') }}" class="primary-button">
        Return
    </a>
</section>
{% endblock %}
